name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: AStorozh
          outputs: |
            dist/github-snake.svg?color_snake=%23000000&color_dots=%23f0f0f0,%23c0c0c0,%23808080,%23404040,%23000000
            dist/github-snake-dark.svg?color_snake=%23ffffff&color_dots=%23161b22,%2330363d,%236e7681,%23b1bac4,%23ffffff

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
